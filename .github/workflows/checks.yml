name: checks
'on':
  - push
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev
      - name: Black
        run: black . --check
        if: always()
      - name: Mypy
        run: mypy forest mc_util hellobot.py
        if: always()
      - name: Pylint
        run: pylint --version; pylint forest mc_util
        if: always()
      - name: Pytest
        run: python -m pytest tests --cov forest --cov mc_util
        if: always()
